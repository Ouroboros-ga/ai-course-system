# Alembic Configuration File
# The single source of truth for schema versions is the alembic_version table.
# Application startup no longer relies on create_all() or db_migrator.py.
#
# Deployment flow:
#   1. python -m app.scripts.migration_ops preflight
#   2. database backup
#   3. alembic upgrade head
#   4. start application
#
# Local demo:
#   python -m app.scripts.dev_db reset-and-upgrade

[alembic]
# Migration scripts directory
# P1-1: use %(here)s to resolve to absolute path of alembic.ini dir, so tests
# can be run from either repo root or backend/ without "alembic path not found"
script_location = %(here)s/alembic

# Version table name
version_table = alembic_version

# Timestamp template for revision filenames
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone
timezone = UTC

# sqlalchemy.url is empty; env.py reads AI_COURSE_DATABASE_URL env var
# This allows both SQLite and PostgreSQL support
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
