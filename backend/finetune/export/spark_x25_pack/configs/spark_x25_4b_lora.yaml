# LLaMA-Factory LoRA SFT —— Spark-X2.5-4B(CS 学科 v2.2 数据)
# 用法: llamafactory-cli train configs/spark_x25_4b_lora.yaml
# 注意: 官方点名使用 XHToken/LlamaFactory fork(含 spark2_5 模板/兼容);若用上游版本,请把 template 改为 tokenizer 自带 chat_template 对应的模板名或 default。

### model
model_name_or_path: XHToken/Spark-X2.5-4B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
# Spark 的线性层命名与 Qwen 不同(q_k_v_proj 融合 QKV / out_proj / gate_proj / up_proj / down_proj / g_proj)
lora_target: q_k_v_proj,out_proj,gate_proj,up_proj,down_proj,g_proj

### dataset
dataset: spark_x25
dataset_dir: data
template: default
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 4

### output
output_dir: saves/spark-x25-4b/lora/sft
logging_steps: 10
save_steps: 100
plot_loss: true
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
