# G3: Judge0 本地代码沙箱 Docker Compose
#
# 独立 Compose：Judge0、Redis、PostgreSQL、专用网络与数据卷。
# 仅监听 127.0.0.1，由后端 SandboxPort 调用。
# 固定镜像版本，不使用 latest。
#
# 启动：docker compose -f deploy/judge0/docker-compose.yml up -d
# 停止：docker compose -f deploy/judge0/docker-compose.yml down
# 回滚：docker compose -f deploy/judge0/docker-compose.yml down -v && git checkout deploy/judge0/

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"

services:
  server:
    image: judge0/judge0:1.13.1
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "127.0.0.1:2358:2358"
    privileged: true
    <<: *default-logging
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - judge0_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2358/system_info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  worker:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    <<: *default-logging
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - judge0_net

  db:
    image: postgres:16.2-alpine
    env_file: judge0.conf
    volumes:
      - judge0_pg_data:/var/lib/postgresql/data/
    <<: *default-logging
    restart: unless-stopped
    networks:
      - judge0_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0 -d judge0"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2.4-alpine
    command: [
      "bash", "-c",
      'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"'
    ]
    env_file: judge0.conf
    <<: *default-logging
    restart: unless-stopped
    networks:
      - judge0_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  judge0_pg_data:
    name: judge0_pg_data

networks:
  judge0_net:
    name: judge0_net
    driver: bridge
    internal: false
