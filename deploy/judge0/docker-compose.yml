# G3: Judge0 本地代码沙箱 Docker Compose
#
# 独立 Compose：Judge0、Redis、PostgreSQL、专用网络与数据卷。
# 仅监听 127.0.0.1，由后端 SandboxPort 调用。
# 固定镜像版本，不使用 latest。
#
# 启动：复制 .env.example 为 .env，替换全部密钥后再执行
#       docker compose --env-file deploy/judge0/.env -f deploy/judge0/docker-compose.yml up -d
# 停止：docker compose -f deploy/judge0/docker-compose.yml down
# 回滚：docker compose -f deploy/judge0/docker-compose.yml down
# 数据卷不会被普通回滚删除；清理卷必须先备份并由运维显式执行。
#
# P0-2 安全约束：本配置已移除 `privileged` 字段。Judge0 isolate 通过
# 最小化的 cap_add: SYS_ADMIN 创建 Linux 命名空间，并保留
# no-new-privileges:true 防止权限提升。如因特殊原因必须使用特权模式
# （例如 isolate 在某些内核版本上无法工作），必须在专用硬化主机上
# 手动配置 privileged: true，并接受部署安全评审；不得通过环境变量
# 在普通主机上开启特权模式。

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"

services:
  server:
    image: judge0/judge0:1.13.1
    # Judge0 reads this as an environment file. Do not mount it as an
    # unrelated file: that leaves server/worker with different credentials
    # than Redis/PostgreSQL.
    env_file: judge0.conf
    environment:
      AUTHN_TOKEN: ${JUDGE0_AUTHN_TOKEN:?set JUDGE0_AUTHN_TOKEN}
      AUTHZ_TOKEN: ${JUDGE0_AUTHZ_TOKEN:?set JUDGE0_AUTHZ_TOKEN}
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD:?set JUDGE0_REDIS_PASSWORD}
      POSTGRES_PASSWORD: ${JUDGE0_POSTGRES_PASSWORD:?set JUDGE0_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:2358:2358"
    # Judge0 isolate must create Linux namespaces. Use the minimal
    # capability (SYS_ADMIN) instead of privileged mode, and keep
    # no-new-privileges to prevent privilege escalation. See the P0-2
    # security note at the top of this file before considering privileged.
    cap_add:
      - SYS_ADMIN
    security_opt:
      - no-new-privileges:true
    <<: *default-logging
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - judge0_net
      # The API container alone has a host-facing bridge so the backend can
      # reach its loopback-published port.  Workers that execute student code
      # remain solely on the internal network below.
      - judge0_api
    healthcheck:
      test: ["CMD-SHELL", "curl -f -H \"X-Auth-Token: $$AUTHN_TOKEN\" -H \"X-Auth-User: $$AUTHZ_TOKEN\" http://localhost:2358/system_info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  worker:
    image: judge0/judge0:1.13.1
    command: ["/bin/bash", "/bootstrap/workers-no-secret-env.sh"]
    env_file: judge0.conf
    environment:
      AUTHN_TOKEN: ${JUDGE0_AUTHN_TOKEN:?set JUDGE0_AUTHN_TOKEN}
      AUTHZ_TOKEN: ${JUDGE0_AUTHZ_TOKEN:?set JUDGE0_AUTHZ_TOKEN}
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD:?set JUDGE0_REDIS_PASSWORD}
      POSTGRES_PASSWORD: ${JUDGE0_POSTGRES_PASSWORD:?set JUDGE0_POSTGRES_PASSWORD}
    # Judge0's upstream isolate may require elevated worker privileges on
    # some Linux hosts. Use the minimal capability (SYS_ADMIN) instead of
    # privileged mode, and keep no-new-privileges to prevent escalation.
    # See the P0-2 security note at the top of this file.
    cap_add:
      - SYS_ADMIN
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./workers-no-secret-env.sh:/bootstrap/workers-no-secret-env.sh:ro
    <<: *default-logging
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - judge0_net

  db:
    image: postgres:16.2-alpine
    env_file: judge0.conf
    environment:
      POSTGRES_PASSWORD: ${JUDGE0_POSTGRES_PASSWORD:?set JUDGE0_POSTGRES_PASSWORD}
    volumes:
      - judge0_pg_data:/var/lib/postgresql/data/
    <<: *default-logging
    restart: unless-stopped
    networks:
      - judge0_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0 -d judge0"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2.4-alpine
    command: [
      "sh", "-c",
      'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"'
    ]
    env_file: judge0.conf
    environment:
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD:?set JUDGE0_REDIS_PASSWORD}
    <<: *default-logging
    restart: unless-stopped
    networks:
      - judge0_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  judge0_pg_data:
    name: judge0_pg_data

networks:
  judge0_net:
    name: judge0_net
    driver: bridge
    internal: true
  judge0_api:
    name: judge0_api
    driver: bridge
