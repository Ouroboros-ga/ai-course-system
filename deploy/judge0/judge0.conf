################################################################################
# Judge0 Configuration for AI-Course-System
################################################################################
# 安全加固配置：固定密码、关闭网络、限制资源、关闭遥测
# 部署前必须修改 REDIS_PASSWORD 和 POSTGRES_PASSWORD

# -------------------- Server --------------------
JUDGE0_TELEMETRY_ENABLE=false
RESTART_MAX_TRIES=3
MAINTENANCE_MODE=false
ENABLE_WAIT_RESULT=true
ENABLE_COMPILER_OPTIONS=false
ENABLE_COMMAND_LINE_ARGUMENTS=false
ENABLE_SUBMISSION_DELETE=false
ENABLE_BATCHED_SUBMISSIONS=true
MAX_SUBMISSION_BATCH_SIZE=5
ENABLE_CALLBACKS=false
ENABLE_ADDITIONAL_FILES=false
SUBMISSION_CACHE_DURATION=1
USE_DOCS_AS_HOMEPAGE=false
DISABLE_IMPLICIT_BASE64_ENCODING=true

# -------------------- Workers --------------------
INTERVAL=0.1
COUNT=2
MAX_QUEUE_SIZE=50

# -------------------- Access Control --------------------
ALLOW_ORIGIN=
DISALLOW_ORIGIN=
# Docker's published loopback port reaches the container through a bridge
# address, not 127.0.0.1.  Host exposure is instead enforced by the Compose
# binding (127.0.0.1:2358); restricting this to 127.0.0.1 causes all backend
# requests to be rejected with 403.
ALLOW_IP=
DISALLOW_IP=

# -------------------- Authentication --------------------
AUTHN_HEADER=X-Auth-Token
AUTHN_TOKEN=CHANGE_ME_JUDGE0_AUTHN_TOKEN

# -------------------- Authorization --------------------
AUTHZ_HEADER=X-Auth-User
AUTHZ_TOKEN=CHANGE_ME_JUDGE0_AUTHZ_TOKEN

# -------------------- Redis --------------------
REDIS_HOST=redis
REDIS_PORT=6379
REDIS_PASSWORD=CHANGE_ME_REDIS_PASSWORD

# -------------------- PostgreSQL --------------------
POSTGRES_HOST=db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=CHANGE_ME_POSTGRES_PASSWORD

# -------------------- Submission Defaults (per-submission) --------------------
# 默认 CPU 时间限制（秒）
CPU_TIME_LIMIT=5
MAX_CPU_TIME_LIMIT=10

# 超时后额外等待时间（秒）
CPU_EXTRA_TIME=1
MAX_CPU_EXTRA_TIME=2

# 墙钟时间限制（秒）
WALL_TIME_LIMIT=10
MAX_WALL_TIME_LIMIT=20

# 内存限制（KB）
MEMORY_LIMIT=128000
MAX_MEMORY_LIMIT=256000

# 栈大小限制（KB）
STACK_LIMIT=64000
MAX_STACK_LIMIT=128000

# 最大进程/线程数
MAX_PROCESSES_AND_OR_THREADS=30
MAX_MAX_PROCESSES_AND_OR_THREADS=60

# 每进程/线程时间限制
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
ALLOW_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true

# 每进程/线程内存限制
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false
ALLOW_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true

# 文件大小限制（KB）
MAX_FILE_SIZE=1024
MAX_MAX_FILE_SIZE=2048

# 运行次数
NUMBER_OF_RUNS=1
MAX_NUMBER_OF_RUNS=3

# 不重定向 stderr 到 stdout
REDIRECT_STDERR_TO_STDOUT=false

# 附加文件提取大小限制（KB）
MAX_EXTRACT_SIZE=1024

# -------------------- Network (DISABLED) --------------------
# 不允许用户设置 ENABLE_NETWORK
ALLOW_ENABLE_NETWORK=false
# 默认关闭网络
ENABLE_NETWORK=false

# -------------------- Rails --------------------
RAILS_ENV=production
RAILS_MAX_THREADS=2
RAILS_SERVER_PROCESSES=1
