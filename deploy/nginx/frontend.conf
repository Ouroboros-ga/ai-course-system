# 前端 Nginx 配置：静态资源 + /api 反代到后端容器。
# 主栈 deploy/docker-compose.yml 的 frontend 服务挂载此文件。
#
# DEP-01 上线前启用 TLS 的步骤：
#   1. 准备证书（Let's Encrypt: certbot certonly --webroot 或前置 LB 终止 TLS）；
#      将 fullchain/privkey 放到 deploy/nginx/certs/ 并挂载进 frontend 容器。
#   2. 把下方“=== TLS 启用区（DEP-01）===”整段取消注释，并注释掉 server { listen 80; ... } 中
#      的静态/API 服务（或保留 80 仅做 301 跳转，见被注释的 redirect server）。
#   3. 启用后同时设置 HSTS（已随 TLS 块一并启用）。
# 证书未就绪前保持现状（HTTP），否则 nginx 会因缺少证书文件拒绝启动。

