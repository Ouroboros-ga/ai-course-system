# 前端 Nginx 配置：HTTPS + 静态资源 + /api 反代。
# 与服务器生效配置一致：/etc/nginx/sites-enabled/smartcarb
#（2026-09-06 重新对齐：补记服务器实际的 80/18080→443 HTTPS 跳转与证书块，
#  并落地缓存策略修正——此前仓库版本与服务器不一致）。
# 根目录指向 current release 的构建产物 dist（发布时由 smartcarb-release.sh 构建，dist 不入 git）。

server {
    listen 80;
    listen 18080;
    server_name zsitai.xyz www.zsitai.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name zsitai.xyz www.zsitai.xyz;

    ssl_certificate     /opt/smartcarb/certs/zsitai.xyz.pem;
    ssl_certificate_key /opt/smartcarb/certs/zsitai.xyz.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /opt/smartcarb/current/frontend/dist;
    index index.html;

    # SPA 回退：前端路由交由 Vue Router 处理。
    # HTML 入口必须 no-cache：index.html 不带哈希，若被浏览器启发式缓存，
    # 发版后刷新仍会启动旧构建（旧版页面闪现复活的来源）。
    # no-cache 仍允许协商缓存（ETag 304），每次只多一个轻量校验请求。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 静态资源缓存：Vite 产物文件名带内容哈希，内容变则文件名变，
    # 可以放心永久缓存 + immutable；ico 无哈希，回落到 location / 的 no-cache。
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|wasm)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API 反代到本机后端
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 110m;
    }

    # 平台同步接口仅允许内网来源
    location ~ ^/api/v1/platform/sync {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 60m;
    }

    # 健康检查
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
