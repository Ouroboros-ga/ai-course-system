# 前端 Nginx 配置：静态资源 + /api 反代到本机后端。
# 与服务器生效配置一致：/etc/nginx/sites-enabled/smartcarb（2026-08-14 对齐 release-layout）。
# 根目录指向 current release 的构建产物 dist（发布时由 smartcarb-release.sh 构建，dist 不入 git）。

server {
    listen 80;
    server_name _;

    root /opt/smartcarb/current/frontend/dist;
    index index.html;

    # SPA 回退：前端路由交由 Vue Router 处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico|wasm)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # API 反代到本机后端
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 110m;
    }

    # 平台同步接口仅允许内网来源
    location ~ ^/api/v1/platform/sync {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 60m;
    }

    # 健康检查
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
