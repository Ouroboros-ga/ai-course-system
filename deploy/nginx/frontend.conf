#
# # HTTP 全部 301 到 HTTPS（与上方 443 server 同时启用）
# server {
#     listen 80;
#     server_name _;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 回退：前端路由交由 Vue Router 处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico|wasm)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # API 反代到 backend 容器（主栈内服务名 backend:8000）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 长任务/上传需要较长超时
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 60m;
    }

    # SEC-01 临时兜底：平台同步接口（syncUser/syncCourse/syncEnrollment）只允许
    # 内网来源调用。泛雅平台侧支持 X-Internal-Service-Token 服务间鉴权后，
    # 应将此段替换为 require_internal_service（移出后端 NO_AUTH_WHITELIST）。
    # 注意：若 nginx 前还有 LB/反代，$remote_addr 是 LB 地址，需把 LB 出口 IP 加入 allow。
    location ~ ^/api/v1/platform/sync {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 60m;
    }

    # 健康检查
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
