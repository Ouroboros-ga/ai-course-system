[project]
name = "repro-runtime"
version = "0.1.0"
description = "Nexus 自主实验执行控制服务（SWE-ReX Docker 后端薄适配，不含业务编排）"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # 执行核心 pin 死版本（T0 已核验：MIT，py>=3.10）；升级须重新走 T1 验证门。
    "swe-rex==1.4.0",
    # swe-rex 1.4.0 未声明但 Docker 后端必需（remote.py import aiohttp，
    # 缺失则 DockerDeployment 无法 import——已实测确认，上游打包缺口）。
    # pin 由 uv.lock 锁定 exact 版本。
    "aiohttp>=3.10",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[dependency-sources]
# 国内服务器构建加速（构建机直连 PyPI 失败时启用）
# swe-rex = { index = "tuna", marker = "sys_platform != 'win32'" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
